name: Pedidos diários (Holex / EZ / Anton)

on:
  schedule:
    # O GitHub atrasa o cron: tenta a cada 15 min das 16:20 às ~19:50 Miami; o 1º após 16:20 envia, o Gist evita repetir
    - cron: '20,35,50,5 20-23 * * 1-5'
    - cron: '5,20,35,50 0 * * 2-6'
  workflow_dispatch:
    inputs:
      date:
        description: 'Data de embarque (YYYY-MM-DD) — vazio = automática'
        required: false
      mode:
        description: 'dry-run (só gera PDF) | test (envia só para o Pedro) | real'
        required: true
        type: choice
        options: [test, dry-run, real]
        default: 'test'

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab requests holidays

      - name: Gerar e enviar
        env:
          RESEND_API_KEY:  ${{ secrets.RESEND_API_KEY }}
          GH_TOKEN:        ${{ secrets.GH_TOKEN }}
          RESULTS_GIST_ID: ${{ secrets.RESULTS_GIST_ID }}
          # Agendado: envia de verdade (liberado pelo Pedro em 2026-10-07). Para pausar, crie a variável
          # do repositório DAILY_ORDERS_MODE = test (só o Pedro recebe) ou dry-run (não envia nada).
          MODE: ${{ github.event_name == 'schedule' && (vars.DAILY_ORDERS_MODE || 'real') || inputs.mode }}
          DATE: ${{ inputs.date }}
        run: |
          ARGS=""
          [ "${{ github.event_name }}" = "schedule" ] && ARGS="$ARGS --respect-clock"
          [ -n "$DATE" ] && ARGS="$ARGS --date $DATE"
          case "$MODE" in
            dry-run) ARGS="$ARGS --dry-run" ;;
            test)    ARGS="$ARGS --test" ;;
            real)    ;;
            *) echo "MODE inválido: $MODE"; exit 1 ;;
          esac
          python orders/daily_orders.py $ARGS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pedidos-${{ github.run_id }}
          path: out/
          retention-days: 30
